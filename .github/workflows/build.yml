name: build

on: 
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runs-on }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:            
          - name: Windows 64
            runs-on: windows-latest
            build-mode: SIMBA_WIN64
            binary: Simba-Win64.exe
            test: Simba-Win64.exe
            
          - name: Windows 32  
            runs-on: windows-latest
            build-mode: SIMBA_WIN32
            binary: Simba-Win32.exe
            test: Simba-Win32.exe

          - name: Linux 64
            runs-on: ubuntu-latest
            build-mode: SIMBA_LINUX64
            binary: Simba-Linux64
            test: Simba-Linux64
          
          - name: AArch64  
            runs-on: ubuntu-latest
            build-mode: SIMBA_AARCH64
            binary: Simba-AArch64
            
          - name: MacOS 64
            runs-on: macos-latest
            build-mode: SIMBA_DARWIN64
            binary: Simba-Darwin64.zip
            test: Simba-Darwin64
            
    steps:
      - uses: actions/checkout@v4.2.2
        with: 
          submodules: true

      - name: Install Lazarus (Mac)
        if: startsWith(matrix.config.name, 'Mac') == true
        uses: ollydev/setup-lazarus@v3.3
        with:
          laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%202.2.0/Lazarus-2.2.0-0-x86_64-macosx.pkg
          fpc-url: |
            https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%202.2.0/fpc-3.2.2.intelarm64-macosx.dmg
            https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%202.2.0/fpc-src-3.2.2-20210709-macosx.dmg

      - name: Install Lazarus (Linux)
        if: startsWith(matrix.config.name, 'Linux') == true || startsWith(matrix.config.name, 'AArch64') == true
        uses: ollydev/setup-lazarus@v3.3
        with:
          laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%202.2.0/lazarus-project_2.2.0-0_amd64.deb
          fpc-url: |
            https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%202.2.0/fpc-laz_3.2.2-210709_amd64.deb
            https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%202.2.0/fpc-src_3.2.2-210709_amd64.deb

      - name: Install Lazarus (Win32)
        if: startsWith(matrix.config.name, 'Windows 32') == true
        uses: ollydev/setup-lazarus@v3.3
        with:
          laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2032%20bits/Lazarus%202.2.0/lazarus-2.2.0-fpc-3.2.2-win32.exe

      - name: Install Lazarus (Win64)
        if: startsWith(matrix.config.name, 'Windows 64') == true
        uses: ollydev/setup-lazarus@v3.3
        with:
          laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%202.2.0/lazarus-2.2.0-fpc-3.2.2-win64.exe

      - name: Build Simba
        run: |
          export GITHUB_SHORT_SHA=$(git rev-parse --short HEAD)
          lazbuild --build-mode=${{ matrix.config.build-mode }} "Source/Simba/Simba.lpi"

      - name: Test Simba
        if: matrix.config.test != ''
        run: |
          if [ "${{ matrix.config.runs-on }}" = "ubuntu-latest" ]; then
              export DISPLAY=:1
              Xvfb :1 & sleep 2
          fi
          if [ "${{ matrix.config.runs-on }}" != "windows-latest" ]; then
              chmod +x ${{ matrix.config.test }}
          fi
          
          ./${{ matrix.config.test }} --silent --run "Tests/simba"

      - name: Upload Binary 
        uses: actions/upload-artifact@v4.6.1
        with:
          name: ${{ matrix.config.binary }}
          path: ${{ matrix.config.binary }}
